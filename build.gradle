plugins {
    id 'com.android.application' version '8.1.0'
}

// 定义项目级别的构建属性
ext {
    compileSdkVersion = 33
    minSdkVersion = 21
    targetSdkVersion = 33
    NDK_VERSION = '25.2.9519653'
}

android {
    namespace 'com.virhuman.testsdk'
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.virhuman.testsdk"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        flavorDimensions "default"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Only include architectures that have native libraries available in libs/
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    signingConfigs {
        myRelease {
            storeFile file('test.jks')
            storePassword 'test1234'
            keyAlias 'test'
            keyPassword 'test1234'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            zipAlignEnabled true
            //移除无用的资源文件
            shrinkResources true
            signingConfig signingConfigs.myRelease
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
        // 测试非混淆
        noobfuscator {
            minifyEnabled false
            zipAlignEnabled false
            shrinkResources false
            signingConfig signingConfigs.myRelease
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
        debug {
            signingConfig signingConfigs.myRelease
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    productFlavors {
        // 默认渠道
        defaultProduct {
            ndk {
                abiFilters 'armeabi-v7a', 'arm64-v8a'
            }
        }
    }

    ndkVersion NDK_VERSION

    // Disable ABI splits completely
    splits {
        abi {
            enable false
        }
    }
    
    // Ensure we only include native libraries for supported architectures
    packaging {
        jniLibs {
            pickFirsts += ['**/*.so']
        }
    }
}
// Repositories are configured in settings.gradle
dependencies {
    implementation fileTree(include: ['*.jar','*.aar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'


    // SDK文档要求使用okhttp 3.11.0版本
    implementation 'com.squareup.okhttp3:okhttp:3.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:3.11.0'
    implementation 'androidx.annotation:annotation:1.3.0'
    
    // JSON解析库
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // RecyclerView和CardView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    // Glide for image loading
    implementation 'com.github.bumptech.glide:glide:4.12.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.12.0'

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}